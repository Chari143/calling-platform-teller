services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: calls
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgres@db:5432/calls
      REDIS_URL: redis://redis:6379
      PUBLIC_BASE_URL: http://localhost:3000
    ports:
      - "3000:3000"
    volumes:
      - uploads:/app/uploads
    depends_on:
      - db
      - redis
    command: sh -c "node -e \"try{require('child_process').execSync('node ./node_modules/.bin/prisma migrate deploy',{stdio:'inherit'})}catch(e){}\" && node dist/index.js"

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/calls
      REDIS_URL: redis://redis:6379
      PUBLIC_BASE_URL: http://localhost:3000
    depends_on:
      - db
      - redis
      - api
    command: sh -c "node dist/worker.js"
    volumes:
      - uploads:/app/uploads

volumes:
  db_data:
  uploads: